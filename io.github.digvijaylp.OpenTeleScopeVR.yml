Summary: VR-based digital telescope/binoculars for low-vision accessibility
Description: |-
  Open TeleScope VR is an accessibility-focused tool designed to be used with a 
  VR headset and a gamepad or keyboard. Built as a specialized fork of Open Camera, 
  it features high-contrast chalkboard filters, D-pad zoom controls, and dynamic 
  lens cycling to assist individuals with low vision.

